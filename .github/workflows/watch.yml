name: liveforce-watch

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

# Never run two watchers at once: a second one would not know what the first has
# already notified about. The newest run wins - without this, a manual re-run would
# sit queued behind the 5-hour run already in progress. The running job normally
# exits on its own (--max-runtime) before the next schedule fires, so cancelling
# here is the exception, not the rule.
concurrency:
  group: liveforce-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium

      # Turns "my edit did not land on the default branch" into a 5-second, obvious
      # failure instead of a confusing 60-second timeout later on.
      - name: Check the committed watcher is current
        run: |
          python - <<'PY'
          import pathlib, sys
          src = pathlib.Path("watch.py").read_text(encoding="utf8")
          if "wait_for_url" in src or "_settle_after_login" not in src:
              sys.exit(
                  "This is the OLD watch.py. The edit did not reach the branch this "
                  "workflow runs on - re-commit watch.py to the default branch."
              )
          print("watch.py is the current version")
          PY

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Carries the "already seen" list between runs. If this ever misses, the
      # next run re-baselines silently rather than announcing the whole board.
      - name: Restore seen-shift list
        uses: actions/cache@v4
        with:
          path: state.json
          key: lf-state-${{ github.run_id }}
          restore-keys: lf-state-

      - name: Watch the job board
        env:
          LF_EMAIL: ${{ secrets.LF_EMAIL }}
          LF_PASSWORD: ${{ secrets.LF_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py --loop --interval 60 --max-runtime 17700
